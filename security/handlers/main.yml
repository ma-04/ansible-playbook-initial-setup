- name: start nftables
  ansible.builtin.service:
    name: nftables.service
    state: started
  become: true
  become_method: sudo

- name: restart ssh
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
    daemon_reload: true
  become: true

# reload, not restart: the unit's ExecStop runs `nft flush ruleset`, which would
# wipe Docker/fail2ban tables. reloaded also starts the service if it is stopped.
- name: reload nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: reloaded
  become: true

- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban.service
    state: restarted
  become: true
  become_method: sudo

- name: restart ufw
  ansible.builtin.service:
    name: ufw.service
    state: restarted
  become: true
  become_method: sudo
  
- name: restart docker
  ansible.builtin.service:
    name: docker.service
    state: restarted
  become: true
  ignore_errors: true
