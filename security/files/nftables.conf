#!/usr/sbin/nft -f

# Only this file's own tables are replaced on reload, so tables owned by
# Docker, fail2ban, wg-quick etc. survive. The create+delete pair makes the
# delete safe when the table does not exist yet.
table inet filter
delete table inet filter
table inet nat
delete table inet nat

define pub_iface = "{{ ansible_default_ipv4.interface }}"
define ssh_port = {{ ssh_port | default(22) }}
define wg_port = {{ wireguard_port | default(51820) }}
define wg_iface = "{{ wg_iface | default('wg0') }}"

{% set _extra_ports = extra_ports | default([]) %}
{% if _extra_ports is string %}{% set _extra_ports = _extra_ports.split(',') %}{% endif %}
{% set _tcp_ports = ([ssh_port | default(22), 80, 443] + _extra_ports) | map('string') | map('trim') | reject('equalto', '') | unique | list %}
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state invalid counter drop comment "early drop of invalid packets"
    ct state { established, related } counter accept comment "accept packets related to existing connections"
    iifname "lo" accept comment "accept loopback"
    iifname $wg_iface accept comment "accept wireguard-server"
    iif != lo ip daddr 127.0.0.1/8 counter drop comment "drop connections to loopback not coming from loopback"
    iif != lo ip6 daddr ::1/128 counter drop comment "drop connections to loopback not coming from loopback"
    icmp type echo-request counter accept comment "accept ping"
    icmpv6 type echo-request counter accept comment "accept ping"
    icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept comment "accept ICMPv6 errors (RFC 4890)"
    icmpv6 type { nd-neighbor-advert, nd-neighbor-solicit, nd-router-advert } ip6 hoplimit 255 counter accept comment "accept neighbor discovery"
    # accept all DHCPv6 packets received at a link-local address
    ip6 daddr fe80::/64 udp dport dhcpv6-client accept comment "accept DHCPv6"

    tcp dport { {{ _tcp_ports | join(', ') }} } accept comment "accept ssh, http, https and extra_ports"
    udp dport $wg_port accept comment "accept wireguard-server port"
    iifname $pub_iface tcp dport 9100 drop comment "drop node_exporter access from public interface"
    tcp dport 9100 accept comment "accept node_exporter access from private interface"
    # Allow ports required for netmaker
    #tcp dport { 3478, 3479, 8089, 8085, 1883, 8883, 8083, 18083 } accept comment "accept netmaker EE ports"
    #udp dport {8400-8500} accept comment "accept netmaker wireguard ports"

    jump custom_input comment "rules from /etc/nftables.d"

    meta l4proto tcp counter reject with tcp reset comment "reject other tcp"
    counter drop comment "drop everything else"
  }

  # Filled by /etc/nftables.d/*.nft, e.g.:
  #   add rule inet filter custom_input tcp dport 8080 accept
  chain custom_input {
  }

  chain forward {
    type filter hook forward priority 0; policy accept;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table inet nat {
  chain postrouting {
    type nat hook postrouting priority 100; policy accept;
    iifname $wg_iface oifname $pub_iface masquerade
    iifname $wg_iface oifname $wg_iface masquerade
  }
}

# Included last so custom files can add rules to custom_input and use the defines above
include "/etc/nftables.d/*.nft"
