- name: disable iptables
  ansible.builtin.service:
    name: iptables
    state: stopped
    enabled: false
  become: true
  ignore_errors: true

- name: disable ufw
  ansible.builtin.service:
    name: ufw
    state: stopped
    enabled: false
  become: true 
  ignore_errors: true

- name: create custom nftables folder
  ansible.builtin.file: 
    state: directory
    dest: /etc/nftables.d
  become: true

# Custom rules are picked up from the role's files dir:
#   files/nftables.d/all/*.nft                     -> every host
#   files/nftables.d/hosts/<inventory_hostname>/*.nft  -> that host only (overrides same-named "all" file, gitignored)
# No matching (or only empty) files means nothing is pushed.
- name: copy custom nftables rules
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/nftables.d/{{ item | basename }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ query('ansible.builtin.fileglob', 'nftables.d/all/*.nft')
          + query('ansible.builtin.fileglob', 'nftables.d/hosts/' ~ inventory_hostname ~ '/*.nft') }}"
  when: lookup('ansible.builtin.file', item) | trim | length > 0
  become: true
  notify: reload nftables

- name: ensure nftables is installed
  ansible.builtin.apt:
    name: nftables
    state: latest
    autoclean: true
    install_recommends: true
    update_cache: true
  become: true

- name: nftables rules
  ansible.builtin.template:
    src: files/nftables.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: nft -c -f %s
  become: true
  notify: reload nftables

# The template validate only runs when nftables.conf itself changes; this also
# catches a broken custom file before the reload handler applies it.
- name: check full nftables ruleset
  ansible.builtin.command: nft -c -f /etc/nftables.conf
  changed_when: false
  become: true